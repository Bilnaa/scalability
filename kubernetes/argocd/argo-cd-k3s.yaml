apiVersion: argoproj.io/v1alpha1
kind: Application # Variante de argo-cd.yaml pour le cluster k3s local (Mac Apple Silicon)
metadata:
  name: argo-cd-app
  namespace: argocd
spec:
  project: default
  source:
    # Notre fork : c'est là qu'on commit, ArgoCD suit ce repo
    repoURL: https://github.com/Bilnaa/scalability.git
    targetRevision: master
    # Chart Helm de l'appli -> ArgoCD fait le "helm template" lui-même
    path: helm/kube-starter
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
