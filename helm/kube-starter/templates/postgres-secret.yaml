apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    {{- include "kube-starter.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-user: {{ .Values.postgres.user | b64enc | quote }} # b64enc -> encodage base64 fait par Helm
  postgres-password: {{ .Values.postgres.password | b64enc | quote }}
