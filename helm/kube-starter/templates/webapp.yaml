apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  labels:
    app: webapp
    {{- include "kube-starter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.webapp.replicas }}
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: "{{ .Values.webapp.image.repository }}:{{ .Values.webapp.image.tag }}"
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.webapp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-service
  labels:
    {{- include "kube-starter.labels" . | nindent 4 }}
spec:
  selector:
    app: webapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
