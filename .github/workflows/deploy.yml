# CI/CD : à chaque push du code des applis
# 1. Build des images arm64 (nœud k3s sur Mac Apple Silicon) et push sur GitHub Container Registry
# 2. Mise à jour du tag des images dans le values.yaml du chart Helm + commit
# 3. ArgoCD détecte le commit et déploie la nouvelle version
name: deploy

on:
  push:
    branches: [master]
    paths:
      - "applications/kube-starter-api/**"
      - "applications/kube-starter-webapp/**"
  workflow_dispatch: # Permet de lancer le workflow à la main depuis l'onglet Actions

permissions:
  contents: write # Pour commit le nouveau tag
  packages: write # Pour push sur ghcr.io

env:
  REGISTRY: ghcr.io/bilnaa # Le nom du owner doit être en minuscules sur ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04-arm # Runner arm64 -> build natif, pas d'émulation
    strategy:
      matrix:
        app: [kube-starter-api, kube-starter-webapp]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: applications/${{ matrix.app }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  update-manifests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mise à jour du tag des images
        run: |
          # Remplace la ligne "tag:" qui suit chaque "repository:" de nos images
          sed -i -E "/repository: ghcr.io\/bilnaa\/kube-starter-(api|webapp)$/{n;s/tag: .*/tag: ${GITHUB_SHA}/}" helm/kube-starter/values.yaml

      # Le push fait avec GITHUB_TOKEN ne redéclenche pas de workflow -> pas de boucle
      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/kube-starter/values.yaml
          git commit -m "deploy: images ${GITHUB_SHA::7}"
          git pull --rebase
          git push
